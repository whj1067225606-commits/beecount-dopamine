name: inspiration_spark
description: Cartoon split notebook — blue inspiration, pink notes, with voice input.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.5
  quick_actions: ^1.0.8
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
